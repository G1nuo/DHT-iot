# 物联网温湿度看板 · 基础设施一键启动
# 用法：cp .env.example .env（填好 INFLUX_TOKEN）后执行 docker compose up -d

services:
  # ---------- MQTT Broker ----------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT over TCP，ESP32 节点连接此端口
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  # ---------- 时序数据库 ----------
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-iot123456}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-iothub}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-sensor}
      DOCKER_INFLUXDB_INIT_RETENTION: 7d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?请先复制 .env.example 为 .env 并填写 INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  # ---------- MQTT → InfluxDB 桥接 ----------
  telegraf:
    image: telegraf:1.30
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN:?请先复制 .env.example 为 .env 并填写 INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-iothub}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-sensor}
    volumes:
      - ./infra/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

volumes:
  influxdb-data:
  mosquitto-data:
  mosquitto-log:
