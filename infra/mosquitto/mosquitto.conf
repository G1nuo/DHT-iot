# Mosquitto 2.0 配置
# 注意：Mosquitto 2.0 起默认只监听 127.0.0.1，必须显式声明 listener 和鉴权策略，
#      否则 ESP32 等其他设备无法连接（这也是本项目踩过的坑之一）。

listener 1883 0.0.0.0

# 仅用于本地实验环境。公网部署请改为 password_file / TLS。
allow_anonymous true

# 消息持久化（容器重启后保留）
persistence true
persistence_location /mosquitto/data/

# 日志输出到容器标准输出，便于 docker logs 查看
log_dest stdout
