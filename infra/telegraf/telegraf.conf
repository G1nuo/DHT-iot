# Telegraf：订阅 MQTT 主题，JSON 解析后写入 InfluxDB 2.x
# Token 通过 docker compose 的环境变量注入，配置文件中不出现明文密钥。

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# ---------- 输入：MQTT 订阅 ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sensor/#"]
  data_format = "json"
  # device_id 是字符串，需显式声明，否则 Telegraf 会推断为数值
  json_string_fields = ["device_id"]
  # 统一 measurement 名称，Flux 查询时更简单
  name_override = "sensor"

# ---------- 输出：InfluxDB v2 ----------
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
